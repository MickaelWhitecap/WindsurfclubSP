<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windsurf Club SP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f8fb;--card:#ffffff;--ink:#0f2a3a;--muted:#587080;--line:#dbe7ee;
  --sea:#0a84c6;--sea-d:#06608f;--sky:#e3f3fc;--sun:#ffb627;--sun-l:#fff4d9;--coral:#ff6b5b;--coral-l:#ffe6e2;--mint:#16b38a;--mint-l:#dcf7ee;
  --wind:#0a84c6;--wind-l:#e3f3fc;--foil:#7b5cff;--foil-l:#eeeaff;--kayak:#ff8a3d;--kayak-l:#fff0e5;
  --ok:#0f9a72;--ok-l:#dcf7ee;--warn:#b86e00;--warn-l:#fff4d9;--bad:#d6402f;--bad-l:#ffe6e2;
  --shadow:0 1px 2px rgba(15,42,58,.06),0 6px 20px rgba(15,42,58,.06);
}
:root[data-theme="dark"]{--bg:#0c1a24;--card:#132634;--ink:#eaf4fa;--muted:#9db4c2;--line:#22394a;--sky:#123247;--sun-l:#3a2f12;--coral-l:#3d1f1b;--mint-l:#123a30;--wind-l:#123247;--foil-l:#251f45;--kayak-l:#3a2414;--ok:#4fdcb0;--ok-l:#123a30;--warn:#ffc35a;--warn-l:#3a2f12;--bad:#ff8a7d;--bad-l:#3d1f1b;--shadow:none}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--sea)}
/* Cabecera con ola */
header{position:sticky;top:0;z-index:5;color:#fff;background:linear-gradient(120deg,#0a84c6 0%,#13a6d8 55%,#22c1c3 100%);box-shadow:0 4px 18px rgba(10,132,198,.25)}
.top{display:flex;align-items:center;gap:12px;max-width:1140px;margin:0 auto;padding:14px 16px 6px}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}.logo svg{flex:none}
.logo h1{font-size:20px;font-weight:800;margin:0;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo small{display:block;font-size:12px;opacity:.85;font-weight:600}
.who{font-size:13px;opacity:.9;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{display:flex;gap:6px;overflow-x:auto;max-width:1140px;margin:0 auto;padding:6px 16px 12px;scrollbar-width:none}
nav button{flex:none;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:0;padding:8px 14px;border-radius:999px;color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
nav button:hover{background:rgba(255,255,255,.24)}nav button.on{background:#fff;color:var(--sea-d)}
main{max-width:1140px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
h2{font-size:21px;font-weight:800;margin:0 0 12px}h3{font-size:16px;font-weight:800;margin:20px 0 8px;color:var(--sea-d)}
:root[data-theme="dark"] h3{color:var(--sea)}
/* Tarjetas de cifras */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.kpi{border-radius:18px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line);background:var(--card);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.kpi .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--cl);color:var(--c);margin-bottom:10px}
.kpi b{display:block;font-size:30px;font-weight:800;line-height:1.1}.kpi span{color:var(--muted);font-size:14px;font-weight:600}
.k1{--c:var(--sea);--cl:var(--sky)}.k2{--c:var(--mint);--cl:var(--mint-l)}.k3{--c:var(--sun);--cl:var(--sun-l)}.k4{--c:var(--coral);--cl:var(--coral-l)}
/* Tablas */
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;white-space:nowrap;background:var(--bg)}
th:first-child{border-top-left-radius:10px}th:last-child{border-top-right-radius:10px}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 55%,transparent)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sky)}
.tablewrap{overflow-x:auto}
.num{display:inline-grid;place-items:center;min-width:34px;height:28px;padding:0 8px;border-radius:9px;background:var(--sky);color:var(--sea-d);font-weight:800;font-size:14px}
:root[data-theme="dark"] .num{color:var(--sea)}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:13px;font-weight:800;color:#fff;margin-right:10px;flex:none}
.pname{display:flex;align-items:center;font-weight:700}
/* Formularios y botones */
input,select,textarea{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sea);box-shadow:0 0 0 3px var(--sky)}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 14px}
.btn{background:var(--sea);color:#fff;border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 2px 0 var(--sea-d)}
.btn:hover{filter:brightness(1.07)}.btn.sec{background:var(--sky);color:var(--sea-d);box-shadow:none}.btn.sun{background:var(--sun);color:#3b2600;box-shadow:0 2px 0 #d48f00}
.btn.small{padding:6px 12px;font-size:14px;border-radius:10px}.btn:disabled{opacity:.45;cursor:default;filter:none}
.junta{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.miembro{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:800;background:var(--sky);color:var(--sea-d)}
.tag.ok{background:var(--ok-l);color:var(--ok)}.tag.warn{background:var(--warn-l);color:var(--warn)}.tag.bad{background:var(--bad-l);color:var(--bad)}
.muted{color:var(--muted)}.err{color:var(--bad);font-weight:700}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}
/* Naves */
.nave{--c:var(--wind);--cl:var(--wind-l)}.nave.foil{--c:var(--foil);--cl:var(--foil-l)}.nave.kayak{--c:var(--kayak);--cl:var(--kayak-l)}
.nave .cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:-20px -20px 16px;padding:16px 20px;background:var(--cl);border-radius:18px 18px 0 0;border-bottom:1px solid var(--line)}
.nave .cab h2{margin:0;color:var(--c)}.nave .badge{background:var(--c);color:#fff;border-radius:999px;padding:3px 12px;font-weight:800;font-size:13px}
.grid-huecos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hueco{overflow-wrap:anywhere}
.hueco{border:1.5px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:9px 10px;font-size:13px;cursor:pointer;background:var(--card);line-height:1.3;transition:transform .1s}
.hueco:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.hueco b{display:block;font-size:16px;color:var(--c)}
.hueco.libre{border-style:dashed;border-left-width:1.5px;background:var(--mint-l);color:var(--ok);font-weight:800;cursor:default}.hueco.libre b{color:var(--ok)}
.hueco.ces{background:var(--sun-l)}
/* Barras de ocupación */
.bar{height:14px;background:var(--bg);border-radius:999px;overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;border-radius:999px;background:var(--c)}
.ocup{display:grid;grid-template-columns:90px 1fr 70px;gap:12px;align-items:center;margin:10px 0;font-weight:700}
.ocup .n{text-align:right;color:var(--muted);font-size:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}
/* Listas */
.lista a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;text-decoration:none;color:var(--ink)}.lista a:hover{background:var(--sky)}
/* Diálogo */
dialog{border:0;border-radius:20px;background:var(--card);color:var(--ink);max-width:760px;width:calc(100% - 24px);padding:0;box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(6,40,60,.45);backdrop-filter:blur(3px)}
dialog .hd{display:flex;align-items:center;gap:10px;padding:16px 20px;background:linear-gradient(120deg,#0a84c6,#22c1c3);color:#fff}
dialog .hd h2{margin:0;flex:1;font-size:19px}dialog .bd{padding:20px;max-height:76vh;overflow:auto}
/* Acceso */
#login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,#0a84c6 0%,#13a6d8 45%,#22c1c3 75%,#ffd27a 100%)}
#login .card{width:100%;max-width:400px;padding:28px;border:0;box-shadow:0 20px 50px rgba(6,40,60,.25)}
#login .marca{display:flex;align-items:center;gap:12px;margin-bottom:6px}#login h2{margin:0;font-size:24px}
.hidden{display:none!important}
/* Campaña */
.camp{background:linear-gradient(135deg,var(--sky),var(--card) 70%)}
.linea{position:relative;height:12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);margin:14px 0 6px}
.linea i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--mint),var(--sea))}
.linea .hoy{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:var(--sun);border:3px solid var(--card);transform:translate(-50%,-50%);box-shadow:var(--shadow)}
.pasos{display:grid;gap:12px}
.paso{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:14px}
.paso .pf{flex:none;width:56px;text-align:center;border-radius:12px;background:var(--sky);color:var(--sea-d);font-size:12px;font-weight:800;text-transform:uppercase;padding:6px 0}
.paso .pf b{display:block;font-size:22px;line-height:1.1}
.paso.toca{border-color:var(--sun);background:var(--sun-l)}.paso.toca .pf{background:var(--sun);color:#3b2600}
.paso.hecho{border-color:var(--mint);background:var(--mint-l)}.paso.hecho .pf{background:var(--mint);color:#fff}
.wa-lista{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.wa-fila{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line)}.wa-fila:last-child{border-bottom:0}
.btn.wa{background:#25d366;box-shadow:0 2px 0 #128c7e;text-decoration:none;white-space:nowrap}.btn.wa.hecho{background:var(--mint-l);color:var(--ok);box-shadow:none}
.avisos details{border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.avisos details.nuevo{border-color:var(--sun)}.avisos details.nuevo summary{background:var(--sun-l)}
.avisos summary{display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}.avisos summary::-webkit-details-marker{display:none}
.avisos summary:after{content:"▾";color:var(--muted)}.avisos details[open] summary:after{content:"▴"}
.avisos .txt{white-space:pre-wrap;padding:4px 14px 14px;font-size:15px}
.pasos-pago{padding-left:22px;margin:6px 0 14px}.pasos-pago li{margin:8px 0}
.copia{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}.copia code{font:700 15px/1.4 ui-monospace,Menlo,monospace;background:var(--card);border:1.5px dashed var(--sun);border-radius:10px;padding:6px 10px;word-break:break-all}
.sug{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.sug.nueva{border-color:var(--sun);background:var(--sun-l)}
.sug .txt{white-space:pre-wrap}.sug .resp{margin-top:10px;padding:10px 12px;border-left:4px solid var(--mint);background:var(--mint-l);border-radius:10px}
.formas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:8px}
.forma{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px}.forma p{margin:4px 0 10px;font-size:14px}
.btn.bizum{background:#05c3de;box-shadow:0 2px 0 #0396ab}
.encargado{display:flex;align-items:center;gap:4px;margin:-4px 0 14px;padding:10px 12px;border-radius:12px;background:var(--cl)}
.aviso-camp{background:linear-gradient(120deg,var(--sun-l),var(--card));border-color:var(--sun)}
.nave .cab .btn.sec{background:var(--card)}
@media (max-width:600px){.who{display:none}.logo h1{font-size:18px}.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:14px 12px}.kpi .ico{width:32px;height:32px;margin-bottom:6px}.kpi b{font-size:21px}.kpi span{font-size:13px}.ocup{grid-template-columns:70px 1fr 60px}th,td{padding:9px 8px}}
</style>
</head>
<body>
<div id="login" class="hidden">
  <div class="card">
    <div class="marca"><svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="#e3f3fc"/><path d="M25 8 L25 33 L12 33 Z" fill="#0a84c6"/><path d="M27 12 L27 33 L37 33 Z" fill="#ffb627"/><path d="M8 37 q4-3 8 0 t8 0 t8 0 t8 0" stroke="#22c1c3" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <div><h2>Windsurf Club SP</h2><span class="muted">Zona de socios</span></div></div>
    <p class="muted" id="loginMsg">Entra con el email que tienes registrado en el club.</p>
    <label>Email</label><input id="lEmail" type="email" autocomplete="email" placeholder="tu@email.com">
    <label>Contraseña</label><input id="lPass" type="password" autocomplete="current-password" placeholder="Mínimo 8 caracteres">
    <div class="flex" style="margin-top:16px"><button class="btn" id="bEntrar">Entrar</button><button class="btn sun" id="bCrear">Crear mi acceso</button></div>
    <p class="muted" style="font-size:14px;margin-bottom:0">¿Primera vez? Escribe tu email y una contraseña nueva, y pulsa «Crear mi acceso».</p>
    <p><a href="#" id="bOlvido">He olvidado mi contraseña</a></p>
    <p id="lErr" class="err"></p>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="top">
      <div class="logo"><svg width="40" height="40" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="rgba(255,255,255,.18)"/><path d="M25 8 L25 33 L12 33 Z" fill="#fff"/><path d="M27 12 L27 33 L37 33 Z" fill="#ffd27a"/><path d="M8 37 q4-3 8 0 t8 0 t8 0 t8 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
        <div><h1>Windsurf Club SP</h1><small id="rol"></small></div></div>
      <span class="who" id="who"></span><button class="btn small" id="bSalir" style="background:rgba(255,255,255,.2);box-shadow:none">Salir</button>
    </div>
    <nav id="nav"></nav>
  </header>
  <main id="main"></main>
</div>

<dialog id="dlg"><div class="hd"><h2 id="dlgT"></h2><button class="btn small" style="background:rgba(255,255,255,.22);box-shadow:none" onclick="dlg.close()">Cerrar</button></div><div class="bd" id="dlgB"></div></dialog>

<script>
const SUPABASE_URL = 'https://rqchoprlrkxlcprdurpo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Hgck5WxY-KFN0JvFA_AlNg_QaCGoUPT';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = v => (v ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => (Number(n)||0).toLocaleString('es-ES',{minimumFractionDigits:0,maximumFractionDigits:2})+' €';
const fecha = d => d ? new Date(d+'T00:00:00').toLocaleDateString('es-ES') : '';
const hoy = () => new Date().toISOString().slice(0,10);
const ANIO = new Date().getFullYear();
let S = {}, TABS = []; // datos en memoria

async function q(p){ const {data,error} = await p; if(error){ alert('Error: '+error.message); throw error; } return data; }

// ---------- Acceso ----------
$('#bEntrar').onclick = async () => {
  $('#lErr').textContent='';
  const {error} = await sb.auth.signInWithPassword({email:$('#lEmail').value.trim(), password:$('#lPass').value});
  if(error) $('#lErr').textContent = error.message.includes('confirmed') ? 'Confirma primero tu email con el enlace que te enviamos.' : 'Email o contraseña incorrectos.';
};
$('#bCrear').onclick = async () => {
  $('#lErr').textContent='';
  const email=$('#lEmail').value.trim(), pass=$('#lPass').value;
  if(pass.length<8){ $('#lErr').textContent='La contraseña debe tener al menos 8 caracteres.'; return; }
  const {error} = await sb.auth.signUp({email, password:pass, options:{emailRedirectTo: location.origin+location.pathname}});
  $('#lErr').textContent = error ? error.message : 'Te hemos enviado un email para confirmar tu acceso. Ábrelo y vuelve aquí para entrar.';
};
$('#bOlvido').onclick = async e => {
  e.preventDefault();
  const email=$('#lEmail').value.trim(); if(!email){ $('#lErr').textContent='Escribe tu email arriba.'; return; }
  await sb.auth.resetPasswordForEmail(email,{redirectTo: location.origin+location.pathname});
  $('#lErr').textContent='Si el email está registrado, recibirás un enlace para cambiar la contraseña.';
};
$('#bSalir').onclick = () => sb.auth.signOut();

sb.auth.onAuthStateChange(async (ev, session) => {
  if(ev==='PASSWORD_RECOVERY'){ const p=prompt('Escribe tu nueva contraseña (mínimo 8 caracteres)'); if(p) { await sb.auth.updateUser({password:p}); alert('Contraseña cambiada.'); } }
  if(session) iniciar(session); else { $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); }
});

async function iniciar(session){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#who').textContent = session.user.email;
  const {data:gestor} = await sb.rpc('es_gestor');
  S.gestor = !!gestor; S.previaEnc=null;
  S.presidente = S.gestor ? !!(await sb.rpc('es_presidente')).data : false;
  if(!S.gestor){ const [a,b]=await Promise.all([sb.rpc('mis_socio_ids'),sb.rpc('mis_naves_encargado')]); S.misIds=(a.data||[]).map(Number); S.misNaves=(b.data||[]).map(Number); } else { S.misIds=[]; S.misNaves=[]; }
  $('#rol').textContent = S.gestor ? 'Panel de gestión' : 'Zona de socio';
  const tabs = S.gestor ? [['resumen','Resumen'],['socios','Socios'],['naves','Naves'],['validar','Validaciones'],['campana','Campaña'],['cuotas','Cuotas'],['espera','Lista de espera'],['junta','Junta directiva'],['sugerencias','Sugerencias']] : [['yo','Mi ficha'],...(S.misNaves.length?[['minave',S.misNaves.length>1?'Mis naves':'Mi nave']]:[]),['junta','Junta directiva'],['sugerencias','Sugerencias']];
  TABS = tabs;
  $('#nav').innerHTML = tabs.map(([k,t])=>`<button data-k="${k}">${t}</button>`).join('');
  $('#nav').onclick = e => { const k=e.target.dataset.k; if(k) ir(k); };
  await cargar();
  ir(tabs[0][0]);
}

async function cargar(){
  const [socios,naves,huecos,cuotas,pagos,tarifas,campanas,mensajes,comunicados,sugerencias] = await Promise.all([
    q(sb.from('socios').select('*').order('numero')),
    q(sb.from('naves').select('*').order('id')),
    q(sb.from('huecos').select('*')),
    q(sb.from('cuotas').select('*')),
    q(sb.from('pagos').select('*').order('fecha',{ascending:false})),
    q(sb.from('tarifas').select('*').order('anio')),
    q(sb.from('campanas').select('*').order('anio')),
    q(sb.from('mensajes').select('*').order('fecha',{ascending:false})),
    q(sb.from('pagos_comunicados').select('*').order('fecha')),
    q(sb.from('sugerencias').select('*').order('fecha',{ascending:false})),
  ]);
  Object.assign(S,{socios,naves,huecos,cuotas,pagos,tarifas,campanas,mensajes,comunicados,sugerencias});
  S.cambios = (S.gestor||S.misNaves.length) ? await q(sb.from('cambios_nave').select('*').order('id',{ascending:false})) : [];
  if(S.gestor){
    S.encargados = await q(sb.from('encargados').select('*'));
    S.espera = await q(sb.from('lista_espera').select('*').order('fecha_peticion'));
    S.avisos = await q(sb.from('avisos').select('*').order('id'));
    S.historial = await q(sb.from('historial').select('*').order('id',{ascending:false}));
  }

async function guardarSocio(id){
  const v={}; CAMPOS.forEach(([k,,t])=>{ const x=$('#f_'+k).value.trim(); v[k]= x===''?null:(t==='number'?Number(x):x); }); v.notas=$('#f_notas').value.trim()||null;
  if(v.email) v.email=v.email.toLowerCase();
  if(!v.nombre){ alert('Falta el nombre.'); return; }
  if(id){ await q(sb.from('socios').update(v).eq('id',id)); await log(id,'datos modificados',''); }
  else {
    if(activos().length>=175){ alert('El club ya tiene 175 socios.'); return; }
    const [n]=await q(sb.from('socios').insert({...v,estado:'activo',tipo:'numerario'}).select());
    const t=S.tarifas.find(t=>t.anio===ANIO)||S.tarifas.at(-1);
    await q(sb.from('cuotas').insert({socio_id:n.id,anio:t.anio,tipo:'entrada',importe:t.cuota_entrada,estado:'pendiente'}));
    await log(n.id,'alta','Alta como socio numerario con cuota de entrada de '+eur(t.cuota_entrada)); id=n.id;
  }

}
async function darBaja(id){

  await q(sb.from('huecos').update({socio_id:null,cesion:false}).eq('socio_id',id));
  await q(sb.from('socios').update({estado:'baja',fecha_baja:hoy()}).eq('id',id));

async function asignar(id){ const h=Number($('#nuevoHueco').value); if(!h) return; await q(sb.from('huecos').update({socio_id:id}).eq('id',h)); const x=S.huecos.find(z=>z.id===h); await log(id,'hueco asignado',`${S.nave[x.nave_id].nombre} ${x.codigo}`); await cargar(); ficha(id); refrescar(); }
async function liberar(h,id){ if(!confirm('¿Liberar este hueco?')) return; const x=S.huecos.find(z=>z.id===h); await q(sb.from('huecos').update({socio_id:null,cesion:false}).eq('id',h)); await log(id,'hueco liberado',`${S.nave[x.nave_id].nombre} ${x.codigo}`); await cargar(); ficha(id); refrescar(); }

async function log(socio_id,evento,detalle){ await q(sb.from('historial').insert({socio_id,evento,detalle})); }
async function ajustarCuota(cuotaId){
  const c=S.cuotas.find(x=>x.id===cuotaId);
  const d=prompt(`Cuota de ${eur(c.importe)}. ¿Cuántos euros regala el club? Escribe ${Number(c.importe)} para dejarla exenta, o 0 para quitar el descuento.`, Number(c.descuento)||0);
  if(d===null) return; const v=Number(String(d).replace(',','.'));
  if(!(v>=0 && v<=Number(c.importe))){ alert('El importe no es válido.'); return; }
  const m=v>0?prompt('Motivo (por ejemplo: trabajos para el club)', c.motivo_exencion||''):'';
  if(m===null) return;
  const exenta=v===Number(c.importe);
  await q(sb.from('cuotas').update({descuento:v, motivo_exencion:m||null, estado:exenta?'exenta':'pendiente'}).eq('id',cuotaId));
  await log(c.socio_id, exenta?'cuota exenta':'descuento', `${c.tipo} ${c.anio}: ${eur(v)}${m?' · '+m:''}`);
  await cargar(); ficha(c.socio_id); refrescar();
}
async function pagoManual(cuotaId){
  const c=S.cuotas.find(x=>x.id===cuotaId);
  const met=prompt('Método de pago: efectivo, transferencia, tarjeta o bizum','transferencia'); if(!met) return;
  if(!['efectivo','transferencia','tarjeta','bizum'].includes(met.trim().toLowerCase())){ alert('Método no válido.'); return; }
  await q(sb.from('pagos').insert({cuota_id:c.id,socio_id:c.socio_id,fecha:hoy(),importe:c.importe-c.descuento,metodo:met.trim().toLowerCase()}));
  await q(sb.from('cuotas').update({estado:'pagada'}).eq('id',c.id));
  await log(c.socio_id,'pago anotado',`${c.tipo} ${c.anio}: ${eur(c.importe-c.descuento)} por ${met}`);
  await cargar(); ficha(c.socio_id); refrescar();
}

const ESTADO_CAMBIO={pendiente:['Pendiente del presidente','warn'],aprobado:['Aprobado','ok'],rechazado:['Rechazado','bad'],anulado:['Retirado','']};
function filaCambio(c,o={}){

function contarSMS(anio,tipo){

  $('#smsInfo').innerHTML = `${n} caracteres (${trozos(n)} SMS por socio) · ${con.length} socios con móvil · unos ${sms} SMS, ≈ ${eur(Math.round(sms*0.06*100)/100)}${ej?`<br>Ejemplo: «${esc(txt)}»`:''}`;
  $('#bSMS').textContent = `Enviar SMS a ${con.length} socios`; $('#bSMS').disabled=!con.length;
}
async function enviarSMS(anio,tipo){
  const a=S.campanas.find(c=>c.anio===anio), d=destinatarios(a,tipo), con=d.socios.filter(s=>movil(s.telefono));
  if(!confirm(`Se enviará un SMS a ${con.length} socios. ¿Continuar?`)) return;
  const b=$('#bSMS'); b.disabled=true; b.textContent='Enviando…';
  const envios=con.map(s=>({socio_id:s.id,texto:textoSMS($('#smsT').value,a,s)}));
  const asunto=$('#avA').value.trim(), cuerpo=$('#avC').value;
  let r; const {data,error}=await sb.functions.invoke('enviar-sms',{body:{anio,tipo,asunto,cuerpo,envios}});
  r=data; if(error){ try{ r=await error.context.json(); }catch(e){ r={error:'No se ha podido enviar.'}; } }
  if(r.error){ alert(r.error); contarSMS(anio,tipo); return; }
  if(r.modo==='simulacion') alert(`MODO SIMULACIÓN: no se ha enviado ningún SMS porque falta conectar la cuenta de SMS.\n\nSe habrían enviado ${r.enviados}${r.fallidos.length?` y fallado ${r.fallidos.length}`:''}.`);
  else { alert(`SMS enviados: ${r.enviados}.${r.fallidos.length?`\nNo enviados: ${r.fallidos.length} (${r.fallidos.slice(0,5).map(f=>(S.socio[f.socio_id]?.numero??'')+': '+f.motivo).join('; ')}${r.fallidos.length>5?'…':''}).`:''}`); await cargar(); }
  contarSMS(anio,tipo);
}
async function copiar(sel){ const el=$(sel); try{ await navigator.clipboard.writeText(el.value); }catch(e){ el.select(); document.execCommand('copy'); } const b=event?.target; if(b){ const t=b.textContent; b.textContent='¡Copiado!'; setTimeout(()=>b.textContent=t,1200); } }
async function copiarTxt(t,b){ try{ await navigator.clipboard.writeText(t); }catch(e){} const o=b.textContent; b.textContent='¡Copiado!'; setTimeout(()=>b.textContent=o,1200); }
async function pagarTPV(cuota_id, metodo){
  const {data,error}=await sb.functions.invoke('redsys-iniciar',{body:{cuota_id,metodo,volver:location.href}});
  let r=data; if(error){ try{ r=await error.context.json(); }catch(e){ r={}; } }
  if(!r||r.error||!r.url){ alert((r&&r.error)||'No se ha podido iniciar el pago. Inténtalo más tarde.'); return; }

  $('#main').innerHTML = `<div class="card"><p>Huecos libres ahora: <b>${libres.length}</b> (${libres.map(h=>esc(S.nave[h.nave_id].nombre+' '+h.codigo)).join(', ')||'ninguno'}). Plazas de socio libres: <b>${plazas}</b>.</p>
    <p class="muted">Un hueco libre se ofrece primero a la lista interna, por orden de fecha. Solo si nadie lo quiere pasa a la externa, y entonces solo si hay plaza de socio (máximo 175).</p>
    <button class="btn" onclick="nuevaEspera()">Añadir a la lista</button></div>
    ${bloque('interna','Lista interna (socios que piden otro hueco)','Tiene prioridad.')}
    ${bloque('externa','Lista externa (aspirantes a socio)','Al entrar pagan la cuota de entrada.')}`;
}
async function estadoEspera(id,v){ await q(sb.from('lista_espera').update({estado:v}).eq('id',id)); await cargar(); }
async function nuevaEspera(){
  const num=prompt('Si ya es socio, escribe su número. Si no, déjalo vacío.');
  let socio=null, nombre;
  if(num){ socio=activos().find(s=>s.numero===Number(num)); if(!socio){ alert('No hay un socio activo con ese número.'); return; } nombre=socio.nombre; }
  else { nombre=prompt('Nombre completo'); if(!nombre) return; }
  const nave=prompt('¿Qué pide? (por ejemplo: Windsurf, Foil 4, Kayak)'); if(!nave) return;
  const notas=socio?null:prompt('Teléfono o email de contacto (opcional)');
  await q(sb.from('lista_espera').insert({tipo:socio?'interna':'externa',socio_id:socio?.id??null,nombre,nave_solicitada:nave,fecha_peticion:hoy(),notas}));
  await cargar(); vEspera();
}

// ---------- Junta directiva ----------
const CARGOS=['Presidente','Presidenta','Vicepresidente','Vicepresidenta','Secretario','Secretaria','Tesorero','Tesorera','Vocal'];
const ordenCargo=c=>{ c=(c||'').toLowerCase(); return c.startsWith('presiden')?10:c.startsWith('vicepres')?20:c.startsWith('secretar')?30:c.startsWith('tesor')?40:c.startsWith('vocal')?60:50; };
function vJunta(){
  const ms=(S.junta||[]).map(j=>{ const s=S.gestor?S.socio[j.socio_id]:(j.nombre?{nombre:j.nombre,numero:j.numero,telefono:j.telefono}:null); return {...j,s,vac:!s}; });
  $('#main').innerHTML=`<div class="card"><div class="flex"><h2 class="grow" style="margin:0">Junta directiva</h2>${S.gestor?'<button class="btn small" onclick="editarJunta()">Añadir cargo</button>':''}</div>
    <p class="muted">${S.gestor?'Los socios ven esta lista en su pestaña «Junta directiva», con el teléfono de quien lo tenga permitido.':'Las personas que dirigen el club. Si necesitas algo, puedes llamarlas o escribir una sugerencia.'}</p>
    ${ms.length?`<div class="junta">${ms.map(j=>`<div class="miembro" ${j.vac?'style="border-style:dashed"':''}>${j.vac?'<span class="av" style="background:var(--line);color:var(--muted);width:48px;height:48px;font-size:20px">?</span>':avatar(j.s,48)}<div class="grow"><span class="tag">${esc(j.cargo)}</span><br>${j.vac?'<b class="muted">Sin designar</b>':`<b>${esc(j.s.nombre)}</b><br><span class="muted" style="font-size:14px">Socio ${j.s.numero??''}${(S.gestor?(j.mostrar_telefono&&j.s.telefono):j.telefono)?` · <a href="tel:${esc(String(j.s.telefono).replace(/\s/g,''))}">${esc(j.s.telefono)}</a>`:''}${S.gestor&&!j.mostrar_telefono?' · teléfono oculto a los socios':''}</span>`}</div>${S.gestor?`<button class="btn sec small" onclick="editarJunta(${j.id})">${j.vac?'Designar':'Cambiar'}</button>`:''}</div>`).join('')}</div>`:'<p class="muted">Todavía no hay nadie en la lista.</p>'}</div>`;
}
function editarJunta(id){
  const j=id?S.junta.find(x=>x.id===id):{cargo:'Vocal',socio_id:null,orden:((S.junta||[]).length+1)*10,mostrar_telefono:true};
  $('#dlgT').textContent=id?`${j.cargo} de la Junta`:'Añadir un cargo a la Junta';
  $('#dlgB').innerHTML=`<label>Cargo</label><input id="jC" list="jCargos" value="${esc(j.cargo)}"><datalist id="jCargos">${CARGOS.map(c=>`<option value="${c}">`).join('')}</datalist>
    <label>Socio</label><select id="jS"><option value="">— Sin designar todavía —</option>${activos().slice().sort((a,b)=>a.numero-b.numero).map(x=>`<option value="${x.id}" ${x.id===j.socio_id?'selected':''}>${x.numero} · ${esc(x.nombre)}</option>`).join('')}</select>
    <label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input id="jT" type="checkbox" ${j.mostrar_telefono?'checked':''} style="width:auto"> Mostrar su teléfono a los socios</label>
    <div class="flex" style="margin-top:14px"><button class="btn" onclick="guardarJunta(${id||0})">Guardar</button>${id?`<button class="btn sec" onclick="quitarJunta(${id})">Eliminar este cargo</button>`:''}</div>`;
  if(!dlg.open) dlg.showModal();
}
async function guardarJunta(id){
  const r={cargo:$('#jC').value.trim()||'Vocal',socio_id:Number($('#jS').value)||null,orden:ordenCargo($('#jC').value),mostrar_telefono:$('#jT').checked};
  const antes=id&&S.junta.find(x=>x.id===id);
  if(id) await q(sb.from('junta_cargos').update(antes.socio_id!==r.socio_id?{...r,desde:r.socio_id?hoy():null}:r).eq('id',id)); else await q(sb.from('junta_cargos').insert({...r,desde:r.socio_id?hoy():null}));
  if(r.socio_id&&(!antes||antes.socio_id!==r.socio_id)) await log(r.socio_id,'Junta directiva',`Entra como ${r.cargo}`);
  if(antes&&antes.socio_id&&antes.socio_id!==r.socio_id) await log(antes.socio_id,'Junta directiva',`Deja el cargo de ${antes.cargo}`);
  dlg.close(); await cargar(); vJunta();
}
async function quitarJunta(id){ const j=S.junta.find(x=>x.id===id); if(!confirm(`¿Eliminar el cargo «${j.cargo}» de la Junta?`)) return; await q(sb.from('junta_cargos').delete().eq('id',id)); if(j.socio_id) await log(j.socio_id,'Junta directiva',`Deja el cargo de ${j.cargo}`); dlg.close(); await cargar(); vJunta(); }

// ---------- Área del socio ----------
function elegirVistaSocio(){
  $('#dlgT').textContent='Ver la web como un socio';
  $('#dlgB').innerHTML=`<p class="muted" style="margin-top:0">Elige un socio y verás exactamente lo que ve al entrar con su email: su ficha, sus cuotas, sus avisos y cómo pagar. No se cambia nada.</p>
    <label>Socio</label><select id="vsS">${activos().slice().sort((a,b)=>a.numero-b.numero).map(x=>`<option value="${x.id}">${x.numero} · ${esc(x.nombre)}</option>`).join('')}</select>
    <div class="flex" style="margin-top:12px"><button class="btn sun" onclick="verComoSocio(Number($('#vsS').value))">Ver como este socio</button></div>`;
  if(!dlg.open) dlg.showModal();
}
function verComoSocio(id){
  dlg.close(); document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('on'));
  $('#rol').textContent='Vista previa: zona de socio'; $('#nav').innerHTML='<button class="on">Mi ficha</button>'; vYo(id); window.scrollTo(0,0);
}
function volverPanel(){ const deNaves=!!S.previaEnc; S.previaEnc=null; if(deNaves){ $('#rol').textContent='Panel de gestión'; $('#nav').innerHTML=TABS.map(([k,t])=>`<button data-k="${k}">${t}</button>`).join(''); ir('naves'); return; } $('#rol').textContent='Panel de gestión'; $('#nav').innerHTML=TABS.map(([k,t])=>`<button data-k="${k}">${t}</button>`).join(''); ir('socios'); }
function vYo(prev){
  const mios=S.socios.filter(x=>(S.misIds||[]).includes(x.id));
  const yo=prev?S.socio[prev]:mios[0];
  if(!yo){ $('#main').innerHTML=`<div class="card"><h2>No encontramos tu ficha</h2><p>Tu email no coincide con el de ningún socio del club. Escribe a la junta para que lo actualicen.</p></div>`; return; }
  const hs=huecosDe(yo.id), cs=S.cuotas.filter(c=>c.socio_id===yo.id).sort((a,b)=>b.anio-a.anio);
  const ret=new URLSearchParams(location.search).get('pago');
  const avisoRet = ret==='ok' ? `<div class="card" style="background:var(--mint-l);border-color:var(--mint)"><b>¡Pago recibido!</b> Gracias. En unos segundos tu cuota aparecerá como pagada.</div>` : ret==='ko' ? `<div class="card" style="background:var(--coral-l);border-color:var(--coral)"><b>El pago no se ha completado.</b> No se te ha cobrado nada. Puedes intentarlo de nuevo o pagar por transferencia.</div>` : '';
  const camp=campanaActual(), hh=hoy();
  let avisoCamp='';
  if(camp && hh>=sumaDias(camp.inicio,-30) && hh<=(camp.prorroga_hasta||camp.fin)){
    const c=cs.find(x=>x.anio===camp.anio&&x.tipo==='anual'), t=tarifaDe(camp.anio);
    const nh=hs.filter(h=>!h.cesion).length, est=t?(nh?nh*t.precio_hueco:t.cuota_patio):null;
    const tit = hh<camp.inicio ? `Campaña de cuotas ${camp.anio}: empieza el ${fLarga(camp.inicio)}` : hh<=camp.fin ? `Campaña de cuotas ${camp.anio}: abierta hasta el ${fLarga(camp.fin)}` : `Campaña de cuotas ${camp.anio}: último plazo hasta el ${fLarga(camp.prorroga_hasta)}`;
    const linea = c ? (c.estado==='pendiente' ? `Tu cuota ${camp.anio} es de <b>${eur(c.importe-c.descuento)}</b> y está pendiente.` : `Tu cuota ${camp.anio} está <b>${c.estado}</b>. ¡Gracias!`) : (est!==null?`Tu cuota ${camp.anio} será de unos <b>${eur(est)}</b> (${nh?`${nh} hueco${nh>1?'s':''} × ${eur(t.precio_hueco)}`:'cuota de patio'}).`:'');
    const pc = c && S.comunicados.find(x=>x.cuota_id===c.id);
    const imp = c ? Number(c.importe)-Number(c.descuento) : est;
    const concepto = `Cuota ${camp.anio} · Socio ${yo.numero}`;
    let pasos='';
    if(!c || c.estado==='pendiente'){
      const puede = c && !prev;
      pasos = `<h3>Cómo pagar mi cuota${c?`: ${eur(imp)}`:''}</h3>
        ${c?'':`<p class="muted" style="margin-top:0">Importe aproximado: ${eur(imp)}. Tu cuota exacta y los botones de pago aparecerán aquí el ${fLarga(camp.inicio)}.</p>`}
        <div class="formas">
          <div class="forma"><b>Opción 1 · Tarjeta o Bizum</b><p class="muted">Pagas al momento y tu cuota queda pagada sola.</p>
            <div class="flex"><button class="btn" ${puede?`onclick="pagarTPV(${c.id},'tarjeta')"`:'disabled'}>Pagar con tarjeta</button><button class="btn bizum" ${puede?`onclick="pagarTPV(${c.id},'bizum')"`:'disabled'}>Pagar con Bizum</button></div></div>
          <div class="forma"><b>Opción 2 · Transferencia</b>
            <ol class="pasos-pago">
              <li>Transfiere a la cuenta del club:${camp.iban?`<div class="copia"><code>${esc(camp.iban)}</code><button class="btn sec small" onclick="copiarTxt('${esc(camp.iban)}',this)">Copiar</button></div>`:''}</li>
              <li>En el concepto escribe:<div class="copia"><code>${esc(concepto)}</code><button class="btn sec small" onclick="copiarTxt('${esc(concepto)}',this)">Copiar</button></div></li>
              <li>Pulsa «Ya he pagado». Cuando la junta compruebe el ingreso, tu cuota pasará a «pagada».</li></ol>
            ${pc ? `<p class="tag ok" style="font-size:15px;padding:8px 14px">Avisaste del pago el ${new Date(pc.fecha).toLocaleDateString('es-ES')}. La junta lo está comprobando.</p>`
                 : `<button class="btn sun" ${puede?`onclick="yaPague(${c.id},${yo.id})"`:'disabled'}>Ya he pagado</button>`}</div>
        </div>`;
    }
    avisoCamp=`<div class="card aviso-camp"><h2 style="margin-bottom:6px">${tit}</h2><p style="margin:0 0 8px">${linea}</p>${pasos}${(!c||c.estado==='pendiente')&&camp.consecuencia?`<p class="muted" style="margin:14px 0 0;font-size:14px">Si no se paga antes del ${fLarga(camp.fin)}: ${esc(camp.consecuencia)}</p>`:''}</div>`;
  }
  const ms=S.mensajes.filter(m=>m.socio_id===yo.id);
  const misAvisos=`<div class="card"><h2>Mis avisos ${ms.filter(m=>!m.leido_en).length?`<span class="tag warn">${(n=>n===1?'1 nuevo':n+' nuevos')(ms.filter(m=>!m.leido_en).length)}</span>`:''}</h2>${ms.length?`<div class="avisos">${ms.map((m,i)=>`<details ${i===0?'open':''} class="${m.leido_en?'':'nuevo'}"><summary><span class="grow"><b>${esc(m.asunto)}</b><br><span class="muted" style="font-size:13px">${new Date(m.fecha).toLocaleDateString('es-ES')} · ${{whatsapp:'por WhatsApp',email:'por correo',web:'en la web'}[m.canal]}${m.por_sms?(m.canal==='web'?' y por SMS':' y SMS'):''}</span></span></summary><div class="txt">${esc(m.cuerpo)}</div></details>`).join('')}</div>`:'<p class="muted">Aquí verás los avisos que te mande el club.</p>'}</div>`;
  if(!prev && ms.some(m=>!m.leido_en)) sb.rpc('marcar_mensajes_leidos');
  const otros=prev?activos().filter(o=>o.id!==yo.id&&o.email&&yo.email&&o.email.toLowerCase()===yo.email.toLowerCase()):mios.slice(1);
  $('#main').innerHTML = `${prev?`<div class="card" style="background:var(--sun-l);border-color:var(--sun)"><div class="flex"><span class="grow"><b>Vista previa.</b> Así ve la web ${esc(yo.nombre)} cuando entra con su email: solo su ficha, sin las pestañas del panel de gestión.</span><button class="btn small" onclick="volverPanel()">Volver al panel</button></div></div>`:''}${avisoRet}${avisoCamp}${ms.some(m=>!m.leido_en)?misAvisos:''}<div class="card"><div class="pname" style="margin-bottom:12px">${avatar(yo,52)}<div><h2 style="margin:0">${esc(yo.nombre)}</h2><span class="num">Socio nº ${yo.numero}</span></div></div>
    <div class="row"><div><label>Email</label>${esc(yo.email)}</div><div><label>Teléfono</label>${esc(yo.telefono)}</div><div><label>Talla de licra</label>${esc(yo.talla_licra)}</div></div>
    <p class="muted">Si algún dato no es correcto, avisa a la junta.</p></div>
    <div class="card"><h2>Mis huecos</h2>${(()=>{ const l=prev?[...new Set(hs.map(h=>h.nave_id))].map(id=>{const e=(S.encargados||[]).find(x=>x.nave_id===id); return e&&{nave:S.nave[id].nombre,encargado:S.socio[e.socio_id]?.nombre,telefono:S.socio[e.socio_id]?.telefono};}).filter(Boolean):(S.misEncargados||[]); return l.length?`<p class="muted" style="margin-top:-4px">${l.map(e=>`Encargado de ${esc(e.nave)}: <b style="color:var(--ink)">${esc(e.encargado)}</b>${e.telefono?` · <a href="tel:${esc(e.telefono)}">${esc(e.telefono)}</a>`:''}`).join(' · ')}</p>`:''; })()}${hs.length?`<div class="grid-huecos">${hs.map(h=>`<div class="hueco nave ${tipoC(S.nave[h.nave_id]||{})} ${h.cesion?'ces':''}" style="cursor:default"><b>${esc(h.codigo)}</b>${esc(h.nave)}${h.cesion?'<br><span class="muted">cesión</span>':''}</div>`).join('')}</div>`:'<p class="muted">Ahora mismo no tienes hueco asignado.</p>'}</div>
    <div class="card"><h2>Mis cuotas</h2><table><tr><th>Año</th><th>Concepto</th><th>Importe</th><th>Estado</th><th></th></tr>
    ${cs.map(c=>`<tr><td>${c.anio}</td><td>${c.tipo}</td><td>${eur(c.importe-c.descuento)}</td><td>${estadoTag(c)}</td><td>${c.estado==='pendiente'&&!prev?`<div class="flex"><button class="btn small" onclick="pagarTPV(${c.id},'tarjeta')">Tarjeta</button><button class="btn bizum small" onclick="pagarTPV(${c.id},'bizum')">Bizum</button></div>`:''}</td></tr>`).join('')}</table></div>
    ${ms.some(m=>!m.leido_en)?'':misAvisos}
    ${otros.length?`<p class="muted">Con este email también están: ${otros.map(o=>esc(o.nombre)).join(', ')}.</p>`:''}`;
}
</script>
</body>
